<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Coach - SportClub</title>
    <link href="../css/dashboardCoach.css" rel="stylesheet">
    <script>
        window.requiredRole = 'coach';
    </script>
    <script defer src="../js/auth-guard.js"></script>
    <script defer src="../js/dashboardCoach.js"></script>
</head>
<body>

    <header class="db-header">
        <div class="header-brand">
            <img src="../assets/logo_empresa_letra_v1.png" alt="Logo SportClub" class="logo-img">
        </div>
        <div class="header-actions">
            <a href="#" class="btn-header btn-profile" id="btnMiPerfilCoachHeader">👤 Mi Perfil</a>
            <a href="#" id="btnCerrarSesion" class="btn-header btn-logout">🚪 Cerrar Sesión</a>
        </div>
    </header>

    <div class="db-container">
        <nav class="db-nav">
            <ul class="nav-list">
                <li><a href="#" id="navPanelCoach" class="nav-link active">🏠 Panel Coach</a></li>
                <li><a href="mantenimiento.html" class="nav-link">🏋️ Mis Clases Asignadas</a></li>
                <li><a href="mantenimiento.html" class="nav-link">👥 Seguimiento Alumnos</a></li>
            </ul>
        </nav>

        <main class="db-main">
            <section class="welcome-banner">
                <h1>Panel Técnico de Entrenamiento</h1>
            </section>

            <div class="grid-content">
                
                <article class="card" id="cardPanelCoach">
                    <header class="card-header">
                        <h2>⏱️ Bloque Actual</h2>
                    </header>
                    <div class="card-body">
                        <h3>CrossFit Inicial</h3>
                        <p><strong>Inscritos:</strong> 18 Alumnos</p>
                        <a href="mantenimiento.html" class="btn-primary">Pasar Lista</a>
                    </div>
                </article>

                <article class="card hidden" id="moduloPerfilCoachCard">
                    <header class="card-header">
                        <h2>👤 Mi Perfil de Coach</h2>
                    </header>
                    <div class="card-body">
                        <div id="perfilViewBlock">
                            <p><strong>Nombre:</strong> <span id="profileName">-</span></p>
                            <p><strong>Email:</strong> <span id="profileEmail">-</span></p>
                            <button id="btnEnableEdit" class="btn-primary">Editar Perfil</button>
                        </div>

                        <form id="perfilEditForm" class="hidden">
                            <label>Nombre:</label>
                            <input type="text" id="editName" class="form-control" required>
                            <label>Email:</label>
                            <input type="email" id="editEmail" class="form-control" required>
                            <button type="submit" class="btn-primary">Guardar</button>
                            <button type="button" id="btnCancelEdit" class="btn-secondary">Cancelar</button>
                        </form>
                    </div>
                </article>

            </div>
        </main>
    </div>
</body>
</html>
