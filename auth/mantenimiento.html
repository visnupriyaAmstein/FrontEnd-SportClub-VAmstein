<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo en Mantenimiento - SportClub</title>
    <link href="../css/mantenimiento.css" rel="stylesheet">
</head>
<body>

    <!-- Contenedor principal centrado en pantalla -->
    <main class="mantenimiento-container">
        
        <!-- Tarjeta visual tipo Card con estética corporativa -->
        <section class="mantenimiento-card">
            
            <header class="mantenimiento-header">
                <img src="../assets/logo_empresa_letra_v1.png" alt="Logo SportClub" class="logo-img">
            </header>

            <div class="mantenimiento-icon">🚀</div>

            <h1 class="mantenimiento-title">¡Próximamente Disponible!</h1>
            
            <p class="mantenimiento-subtitle">
                Estamos digitalizando y optimizando este módulo con tecnología avanzada para ofrecerte la mejor experiencia deportiva en tu plataforma.
            </p>

            <!-- Barra de progreso simulada (Estética Tecnológica) -->
            <div class="progress-container">
                <div class="progress-bar"></div>
            </div>
            <span class="progress-text">Preparando tu mejor versión...</span>

            <!-- Botón funcional para regresar de forma segura -->
            <div class="mantenimiento-actions">
                <button onclick="history.back()" class="btn-block">Volver Atrás</button>
            </div>

        </section>
    </main>

</body>
</html>
