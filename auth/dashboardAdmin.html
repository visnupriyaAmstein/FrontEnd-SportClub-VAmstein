<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - SportClub</title>
    <link href="../css/dashboardAdmin.css" rel="stylesheet">
    <script>
        window.requiredRole = 'admin';
    </script>
    <script src="../js/auth-guard.js"></script>
    <script defer src="../js/crudUsuarios.js"></script>
    <script defer src="../js/dashboardAdmin.js"></script>
</head>
<body>

    <header class="db-header">
        <div class="header-brand">
            <img src="../assets/logo_empresa_letra_v1.png" alt="Logo SportClub" class="logo-img">
        </div>
        <div class="header-actions">
            <a href="#" class="btn-header btn-profile" id="btnMiPerfilAdminHeader">👤 Mi Perfil</a>
            <a href="#" class="btn-header btn-logout" id="logoutBtn">🚪 Cerrar Sesión</a>
        </div>
    </header>

    <div class="db-container">
        <nav class="db-nav">
            <ul class="nav-list">
                <li><a href="dashboardAdmin.html" class="nav-link">🛡️ Panel Global</a></li>
                <li><a href="#" class="nav-link active">👥 Usuarios</a></li>
            </ul>
        </nav>

        <main class="db-main">
            <section class="welcome-banner">
                <h1>Gestión de Usuarios</h1>
            </section>

            <div id="crudMessageContainer" class="feedback-container"></div>

            <div class="grid-content full-width-grid">
                
                <article class="card" id="cardListadoMaestro">
                    <header class="card-header-actions">
                        <h2>👥 Listado Maestro de Usuarios</h2>
                        <button id="btnAbrirCrear" class="btn-primary btn-success-action">➕ Nuevo Usuario</button>
                    </header>
                    <div class="card-body">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>ID</th><th>Nombre</th><th>Email</th><th>Rol</th><th>Registro</th><th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tablaUsuariosBody"></tbody>
                        </table>
                    </div>
                </article>

                <article class="card hidden" id="moduloPerfilAdminCard">
                    <header class="card-header" style="margin-bottom: 15px;">
                        <h2>🛡️ Mi Perfil de Administrador</h2>
                    </header>
                    <div class="card-body">
                        <div id="perfilAdminMessageContainer"></div>

                        <div id="perfilAdminViewBlock">
                            <p><strong>Nombre:</strong> <span id="viewAdminFullName">-</span></p>
                            <p><strong>Email:</strong> <span id="viewAdminEmail">-</span></p>
                            <button type="button" id="btnAdminEnableEdit" class="btn-primary">Editar Perfil</button>
                        </div>

                        <form id="perfilAdminForm" class="hidden" novalidate>
                            <input type="text" id="perfilAdminFullName" placeholder="Nombre completo">
                            <input type="email" id="perfilAdminEmail" placeholder="Email">
                            <input type="date" id="perfilAdminBirthDate">
                            
                            <hr>
                            <h3>🔒 Cambiar Contraseña</h3>
                            <input type="password" id="currentAdminPassword" placeholder="Contraseña actual">
                            <input type="password" id="newAdminPassword" placeholder="Nueva contraseña">
                            <input type="password" id="confirmAdminPassword" placeholder="Confirmar nueva">
                            
                            <button type="submit" class="btn-primary">Guardar cambios</button>
                            <button type="button" id="btnAdminCancelEdit" class="btn-secondary">Cancelar</button>
                        </form>
                    </div>
                </article>

            </div>
        </main>
    </div>
</body>
</html>
