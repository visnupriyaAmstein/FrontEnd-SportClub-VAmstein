<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SportClub</title>
    <link href="../css/login.css" rel="stylesheet">
</head>

<body>

    <main class="login-container">
        
        <div class="login-card">
            
            <header class="login-header">
                <img src="../logo_empresa_letra_v1.png" alt="Logo SportClub" class="logo-img">
            </header>

            <h2 class="login-title">Iniciar Sesión</h2>

            <form action="dashboardUsuario.html" method="GET" class="login-form">
                
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Ingresa tu correo" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
                </div>

                <button  href="registro.html" type="submit" class="btn-block">Ingresar</button>
                
            </form>

            <hr class="divider">

            <footer class="login-footer" style="flex-direction: column; gap: 1rem;">
                <div class="footer-row" style="display: flex; align-items: center; justify-content: center; gap: 15px;">
                    <a href="recuperar.html" class="footer-link">¿Olvidaste tu contraseña?</a>
                    <span class="separator">|</span>
                    <a href="registro.html" class="footer-link btn-registrar">Registrarse</a>
                </div>

                <div class="evaluator-links" style="display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 0.5rem; width: 100%;">
                    <a href="dashboardCoach.html" class="footer-link" style="color: #2b124c; font-size: 0.8rem; background: #f4eefa; padding: 0.4rem 0.8rem; border-radius: 15px;">
                        ⚙️ Dashboard Coach
                    </a>
                    <span class="separator" style="color: #e5e7eb;">|</span>
                    <a href="dashboardAdmin.html" class="footer-link" style="color: #2b124c; font-size: 0.8rem; background: #f4eefa; padding: 0.4rem 0.8rem; border-radius: 15px;">
                        👑 Dashboard Admin
                    </a>
                </div>
            </footer>

        </div>
    </main>

</body>

</html>
