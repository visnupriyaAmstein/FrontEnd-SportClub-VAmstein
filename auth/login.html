<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SportClub</title>
    <link href="../css/style.css" rel="stylesheet">
</head>

<body>

    <main class="login-container">
        
        <div class="login-card">
            
            <header class="login-header">
                <img src="../logo_empresa_letra_v1.png" alt="Logo SportClub" class="logo-img">
            </header>

            <h2 class="login-title">Iniciar Sesión</h2>

            <form action="#" method="POST" class="login-form">
                
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Ingresa tu correo" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
                </div>

                <button type="submit" class="btn-block">Ingresar</button>
                
            </form>

            <hr class="divider">

            <footer class="login-footer">
    <a href="#" class="footer-link">¿Olvidaste tu contraseña?</a>
    <span class="separator">|</span>
    <a href="registro.html" class="footer-link btn-registrar">Registrarse</a>
</footer>

        </div>
    </main>

</body>

</html>
