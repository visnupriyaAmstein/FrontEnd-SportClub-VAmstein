<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SportClub</title>
    <link href="../css/login.css" rel="stylesheet">
</head>

<body>

    <main class="login-container">
        
        <section class="login-card">
            
            <header class="login-header">
                <a href="javascript:void(0)" onclick="history.back()" class="btn-back" aria-label="Volver atrás">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                 </a>
                <img src="../assets/logo_empresa_letra_v1.png" alt="Logo SportClub" class="logo-img">
            </header>

            <h2 class="login-title">Iniciar Sesión</h2>

            <form id="loginForm" class="login-form">
                
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Ingresa tu correo" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
                </div>

                <button type="submit" class="btn-block">Ingresar</button>
                
                <p id="loginMessage" style="color: red; text-align: center; margin-top: 10px; font-weight: bold; min-height: 20px;"></p>
                
            </form>

            <hr class="divider">

            <footer class="login-footer" style="flex-direction: column; gap: 1rem;">
                <div class="footer-row" style="display: flex; align-items: center; justify-content: center; gap: 15px;">
                    <a href="recuperar.html" class="footer-link">¿Olvidaste tu contraseña?</a>
                    <span class="separator">|</span>
                    <a href="registro.html" class="footer-link btn-registrar">Registrarse</a>
                </div>

            </footer>

        </section>
    </main>
    <script src="../js/login.js"></script>
</body>

</html>
